<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard — Pitboss</title>
  <meta name="theme-color" content="#08080d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pitboss" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="smoke-canvas"></canvas>

  <nav class="nav">
    <a href="dashboard.html" class="nav-brand">
      <svg class="spade-icon" viewBox="0 0 100 120" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 C50 5 5 38 5 65 C5 82 18 94 35 90 C28 100 22 112 22 112 L78 112 C78 112 72 100 65 90 C82 94 95 82 95 65 C95 38 50 5 50 5Z"/>
      </svg>
      <span class="brand-text">PITBOSS</span>
    </a>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link active">Dashboard</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-stats-group">
      <div class="nav-stat-item" title="Current time (Central)">
        <span class="nav-stat-label">CT</span>
        <span class="nav-stat-value gold" id="stat-time-val">--:-- --</span>
      </div>
      <div class="nav-stat-item" title="Bot status">
        <span class="nav-stat-dot" id="stat-bot-dot"></span>
        <span class="nav-stat-label">Bot</span>
        <span class="nav-stat-value" id="stat-bot-val">—</span>
      </div>
      <div class="nav-stat-item" title="Members online">
        <span class="nav-stat-label">Online</span>
        <span class="nav-stat-value" id="stat-members-val">—</span>
      </div>
      <div class="nav-stat-item" title="Queued jobs">
        <span class="nav-stat-label">Queued</span>
        <span class="nav-stat-value" id="stat-scheduled-val">—</span>
      </div>
    </div>
    <button class="btn-logout" id="logout-btn">Sign Out</button>
  </nav>

  <div class="main-content">
    <div class="columns">

      <!-- ==================== COLUMN 1: BROADCAST ==================== -->
      <div class="panel" id="dash-panel-broadcast">
        <div class="panel-header collapsible" data-panel="dash-panel-broadcast">
          <span class="panel-title">📣 Broadcast</span>
          <div class="panel-toggle">
            <span class="panel-toggle-arrow">▼</span>
          </div>
        </div>
        <div class="panel-body">
          <div id="msg-toolbar-wrap"></div>
          <textarea
            id="msg-textarea"
            class="compose-area"
            placeholder="Type your message here... supports **bold**, *italic*, `code`, > quotes and more Discord markdown"
          ></textarea>

          <div class="preview-panel">
            <div class="preview-label">Preview</div>
            <div id="msg-preview-content"></div>
          </div>

          <div class="form-group mt-12">
            <label for="msg-channel" style="font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);display:block;margin-bottom:6px;">Channel</label>
            <select id="msg-channel" class="form-control channel-dropdown"></select>
          </div>

          <div class="btn-row" style="margin-top:10px;align-items:center;">
            <div id="msg-emoji-wrap"></div>
          </div>

          <div class="btn-row" style="margin-top:8px;">
            <button type="button" class="btn btn-outline btn-sm" id="msg-btn-test">🧪 Test</button>
            <button type="button" class="btn btn-gold btn-sm" id="msg-btn-send">⚡ Send Now</button>
            <button type="button" class="btn btn-outline btn-sm" id="msg-btn-schedule">📅 Schedule</button>
          </div>

          <div class="schedule-picker" id="msg-schedule-picker">
            <label>Date & Time (Central Time)</label>
            <input type="datetime-local" class="form-control" id="msg-schedule-datetime" style="margin-bottom:8px;" />
            <button type="button" class="btn btn-gold btn-sm" id="msg-btn-confirm-schedule">Confirm Schedule</button>
          </div>

        </div>
      </div>

      <!-- ==================== COLUMN 2: POLL GENERATOR ==================== -->
      <div class="panel" id="dash-panel-poll">
        <div class="panel-header collapsible" data-panel="dash-panel-poll">
          <span class="panel-title">🗳️ Poker Night Vote</span>
          <div class="panel-toggle">
            <span class="panel-toggle-arrow">▼</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="row-2col" style="margin-bottom:10px;">
            <div class="form-group" style="margin:0;">
              <label for="poll-month" style="font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);display:block;margin-bottom:6px;">Month</label>
              <select id="poll-month" class="form-control">
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
              </select>
            </div>
            <div class="form-group" style="margin:0;">
              <label for="poll-year" style="font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);display:block;margin-bottom:6px;">Year</label>
              <select id="poll-year" class="form-control"></select>
            </div>
          </div>

          <button type="button" class="btn btn-gold" id="poll-gen-btn" style="width:100%;margin-bottom:12px;">
            ✨ Generate Poll
          </button>

          <div id="poll-preview-wrap" class="poll-options-preview"></div>

          <div class="form-group mt-12">
            <label for="poll-channel" style="font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);display:block;margin-bottom:6px;">Channel</label>
            <select id="poll-channel" class="form-control channel-dropdown"></select>
          </div>

          <div class="btn-row" style="margin-top:8px;">
            <button type="button" class="btn btn-outline btn-sm" id="poll-btn-test">🧪 Test</button>
            <button type="button" class="btn btn-gold btn-sm" id="poll-btn-send">⚡ Send Now</button>
            <button type="button" class="btn btn-outline btn-sm" id="poll-btn-schedule">📅 Schedule</button>
          </div>

          <div class="schedule-picker" id="poll-schedule-picker">
            <label>Date & Time (Central Time)</label>
            <input type="datetime-local" class="form-control" id="poll-schedule-datetime" style="margin-bottom:8px;" />
            <button type="button" class="btn btn-gold btn-sm" id="poll-btn-confirm-schedule">Confirm Schedule</button>
          </div>

        </div>
      </div>

      <!-- ==================== COLUMN 3: ANNOUNCE & REMIND ==================== -->
      <div class="panel" id="dash-panel-remind">
        <div class="panel-header collapsible" data-panel="dash-panel-remind">
          <span class="panel-title">📣 Announce & ⏰ Remind</span>
          <div class="panel-toggle">
            <span class="panel-toggle-arrow">▼</span>
          </div>
        </div>
        <div class="panel-body">
  <!-- SHARED: Poker Night Date -->
  <div class="form-group">
    <label for="poker-date">Next Poker Night (CT)</label>
    <input type="datetime-local" id="poker-date" class="form-control" />
  </div>

  <!-- ========== ANNOUNCEMENT GENERATOR ========== -->
  <div class="section-divider-label">Announcement</div>

  <div class="form-group">
    <label for="announce-channel">Channel</label>
    <select id="announce-channel" class="form-control channel-dropdown"></select>
  </div>

  <div class="form-group">
    <label for="announce-image-url">Image URL <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-dim)">(optional — posts 1–2s before announcement)</span></label>
    <input type="url" id="announce-image-url" class="form-control" placeholder="https://i.imgur.com/..." />
  </div>

  <button type="button" class="btn btn-gold" id="announce-gen-btn" style="width:100%;margin-bottom:12px;">
    📣 Generate Announcement
  </button>

  <div id="announce-preview-wrap" style="display:none;">
    <textarea id="announce-preview-text" class="compose-area" style="min-height:240px;font-family:Inter,sans-serif;font-size:13px;line-height:1.7;"></textarea>
    <div class="btn-row" style="margin-top:10px;">
      <button type="button" class="btn btn-outline btn-sm" id="announce-btn-test">🧪 Test</button>
      <button type="button" class="btn btn-gold btn-sm" id="announce-btn-send">⚡ Send Now</button>
      <button type="button" class="btn btn-outline btn-sm" id="announce-btn-schedule">📅 Schedule</button>
    </div>
    <div class="schedule-picker" id="announce-schedule-picker">
      <label>Date & Time (Central Time)</label>
      <input type="datetime-local" class="form-control" id="announce-schedule-datetime" style="margin-bottom:8px;" />
      <button type="button" class="btn btn-gold btn-sm" id="announce-btn-confirm-schedule">Confirm Schedule</button>
    </div>
  </div>

  <div class="divider" style="margin:18px 0;"></div>

  <!-- ========== REMINDER GENERATOR ========== -->
  <div class="section-divider-label">Reminders</div>

  <button type="button" class="btn btn-gold" id="reminders-gen-btn" style="width:100%;margin-bottom:12px;">
    ⏰ Generate Reminders
  </button>

  <div id="reminders-container"></div>

  <button type="button" class="btn btn-gold schedule-all-btn" id="reminders-schedule-all">
    📅 Schedule All 3
  </button>

  <div class="divider" style="margin:20px 0;"></div>

  <!-- ========== JOIN THE TABLE ========== -->
  <div class="section-divider-label">Join The Table</div>

  <div id="table-config-warn" style="display:none;font-size:12px;color:var(--amber-text);padding:9px 12px;background:rgba(95,58,30,0.15);border:1px solid rgba(251,191,36,0.2);border-radius:8px;margin-bottom:12px;">
    ⚠️ Configure Join-the-Table settings in <a href="settings.html" style="color:var(--gold);">Settings → 🃏 Join The Table</a> first.
  </div>

  <div class="form-group">
    <label for="table-url">PokerNow Table URL</label>
    <input type="url" id="table-url" class="form-control" placeholder="https://www.pokernow.com/games/..." />
  </div>

  <div class="form-group">
    <label for="table-schedule-time">Post Time (CT)</label>
    <input type="datetime-local" id="table-schedule-time" class="form-control" />
  </div>

  <div id="table-preview" style="display:none;padding:10px 14px;background:rgba(212,178,84,0.05);border:1px solid rgba(212,178,84,0.15);border-radius:8px;font-size:13px;line-height:1.8;color:var(--text-primary);white-space:pre-wrap;margin-bottom:10px;font-family:'JetBrains Mono',monospace;"></div>

  <div class="btn-row">
    <button type="button" class="btn btn-outline btn-sm" id="table-btn-test">🧪 Test</button>
    <button type="button" class="btn btn-gold btn-sm" id="table-btn-schedule">📅 Schedule</button>
  </div>
</div>
      </div>

    </div>

    <!-- ==================== FULL-WIDTH UPCOMING QUEUE ==================== -->
    <div class="panel upcoming-panel" style="margin-top:24px;">
      <div class="panel-header">
        <span class="panel-title">📅 Upcoming Queue</span>
        <span class="queue-count-badge" id="queue-count-badge" style="display:none;"></span>
      </div>
      <div class="panel-body" style="padding:16px 20px;">
        <div id="unified-queue" class="unified-queue">
          <div class="queue-empty">Loading...</div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
